<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1f2937;
      margin: 0;
    }
    h3 {
      margin: 0 0 16px 0;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
    }
    /* 现代化 Switch 样式 */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2563eb; /* DeepSeek 蓝 */
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .desc {
      font-size: 12px;
      color: #6b7280;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h3>DeepTuck 设置</h3>
  <div class="toggle-row">
    <span>启用自动折叠</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch">
      <span class="slider"></span>
    </label>
  </div>
  <div class="desc">关闭后，已折叠的内容将瞬间恢复原状，且不再自动折叠新消息。</div>
  <script src="popup.js"></script>
</body>
</html>
